# 我們的小金庫：CI 與 GitHub Pages 部署
# - push 到 main：檢查 → 測試 → 建置（子路徑 /<repo>/）→ 檢查 dist → 部署到 GitHub Pages
# - Pull Request：只做檢查、測試、建置與 dist 檢查，不部署
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 專案頁面部署在 https://<帳號>.github.io/<repo>/，所以資源要放在 /<repo>/ 子路徑
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check package-lock（只允許 registry.npmjs.org）
        run: npm run check:lockfile

      - name: Install（npm ci）
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check dist（子路徑資源、CSP、無外部網址）
        run: npm run check:dist

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
